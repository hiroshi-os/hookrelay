services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: hookrelay
      POSTGRES_DB: hookrelay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 2s
      timeout: 5s
      retries: 30

  hookrelay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hookrelay:hookrelay@postgres:5432/hookrelay?sslmode=disable
      HTTP_ADDR: ":8080"
      ADMIN_TOKEN: dev-admin-token
      WORKERS: "4"
      DELIVERY_TIMEOUT: 5s
      BACKOFF_BASE: 1s
      BACKOFF_CAP: 5m
      MAX_ATTEMPTS: "12"
    ports:
      - "8080:8080"

  chaosrecv:
    build: .
    entrypoint: ["/chaosrecv"]
    command: ["-addr", ":9090", "-secret", "test-secret", "-fail-5xx", "0.1", "-fail-reset", "0.1", "-fail-timeout", "0.05", "-fail-slow", "0.05"]
    ports:
      - "9090:9090"
